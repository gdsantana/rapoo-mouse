[package]
name = "rapoo-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rapoo-native-core = { path = "../native-core" }

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9.3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
